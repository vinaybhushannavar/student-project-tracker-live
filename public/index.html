<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Project List</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Space Theme Animated Background Elements -->
  <div class="meteor-shower">
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
  </div>

  <main>
    <header>
      <h1>Stellar Project Command Center</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Track our electronics project ideas in orbit.</p>
    </header>

    <section>
      <h2 id="form-title">Add Project</h2>
      <form id="project-form">
        <label for="name">Project Name</label>
        <input type="text" id="name" name="name" required maxlength="80" autocomplete="off">

        <label for="status">Project Status</label>
        <select id="status" name="status">
          <option value="Planned">Planned</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>

        <button id="save-button" type="submit">Save</button>
        <button id="cancel-button" type="button" style="display: none;">Cancel</button>
      </form>
      <p id="message" role="status" aria-live="polite" style="margin-top: 0.75rem; font-size: 0.9rem;"></p>
    </section>

    <section>
      <h2 id="list-title">Projects</h2>
      <p id="empty-state">No projects available.</p>
      <ul id="project-list" style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0.75rem;"></ul>
    </section>
  </main>
</body>
</html>
